"name": "Meetup"
"description": "Plan a meetup event"
"title": "[Meetup]"
"labels":
  - "meetup"
"body":
  - type: markdown
    attributes:
      value: |
        Complete the checklists as you prepare the event.
  - "type": "input"
    "id": "event_date"
    "attributes":
      "label": "Event Date"
      "description": "Proposed date (YYYY-MM-DD)."
      "placeholder": "YYYY-MM-DD"
  - "type": "dropdown"
    "id": "hoster"
    "attributes":
      "label": "Hoster"
      "description": "Select the event host."
      "options":
        - "Hoster 1"
        - "Hoster 2"
  - "type": "textarea"
    "id": "conference_hall_proposals"
    "attributes":
      "label": "Conference Hall proposals"
      "description": "Accepted proposal IDs, one per line, in talk order."
    "validations":
      "required": false
  - type: markdown
    attributes:
      value: |
        Automation manages event details, emails and slide sharing. Review approval requests in the comments.
  - "type": "checkboxes"
    "id": "slides"
    "attributes":
      "label": "Event materials"
      "description": "Prepare community content and collect slides."
      "options":
        - "label": "Add community news and surveys"
        - "label": "Collect host slides"
        - "label": "Collect speaker slides"
  - "type": "checkboxes"
    "id": "communication"
    "attributes":
      "label": "Communication"
      "description": "Automation updates these publication statuses after delivery. Review approval requests in the comments."
      "options":
        - "label": "Announce on Slack - AixMarseille.Tech"
        - "label": "Announce on Slack - OpenBaR"
        - "label": "Announce on LinkedIn"
  - type: checkboxes
    id: event_logistics
    attributes:
      label: Event logistics
      description: Check when arranged or unnecessary.
      options:
        - label: "Arrange the game"
        - label: "Arrange goodies"
  - "type": "dropdown"
    "id": "aperitif"
    "attributes":
      "label": "Aperitif"
      "description": "Provide food and drinks?"
      "options":
        - "Yes"
        - "No"
  - "type": "dropdown"
    "id": "restaurant"
    "attributes":
      "label": "Restaurant / Bar"
      "description": "Meet at a restaurant or bar afterwards?"
      "options":
        - "Yes"
        - "No"
  - "type": "checkboxes"
    "id": "post-event"
    "attributes":
      "label": "Post event"
      "description": "Complete after the event. Include photos and links in the recap."
      "options":
        - "label": "Import attendees into CNCF"
        - "label": "Share recap on LinkedIn"
