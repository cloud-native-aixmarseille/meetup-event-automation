name: Reconcile event publication
description: Reconcile configured publication destinations and publish each event after its verified organizer approval.
inputs:
  meetup-event-url-prefix:
    description: HTTPS event URL prefix for the authorized Meetup group, ending in /events/.
    required: true
  community-event-url-prefixes:
    description: JSON array of nonempty HTTPS prefixes accepted for community event URLs.
    required: true
  asset-folder-url-prefix:
    description: HTTPS prefix accepted for event asset folder URLs.
    required: true
  slack-token:
    description: Slack bot token for organizer approval notifications and decision reactions.
    required: true
  slack-organizer-channel-id:
    description: Organizer Slack channel receiving publication approval requests.
    required: true
  issue-number:
    description: Meetup source issue number.
    required: true
  github-token:
    description: Consumer repository token with contents read and issues write.
    required: true
  managed-comment-author:
    description: Login of the GitHub App bot that owns the publication journal.
    required: true
  conference-hall-event:
    description: Conference Hall CFP slug used to resolve the current event agenda.
    required: true
  conference-hall-api-key:
    description: Read-only Conference Hall event API key.
    required: true
  locale:
    description: Language for the publication report (en or fr).
    required: true
  publication-credentials:
    description: JSON credentials keyed by configured provider. Meetup requires email, password, and ai (provider, model, apiKey); OCGroups requires username and password.
    required: true
runs:
  using: node24
  main: dist/index.js
