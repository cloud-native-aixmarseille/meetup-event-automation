name: Reconcile meetup assets
description: Reconcile the event Drive folder, template copies, post-event presentation PDF, and issue asset link. Report concise technical facts and diagnostic codes in logs and the job summary.
author: Cloud Native Aix-Marseille
inputs:
  meetup-event-url-prefix:
    description: HTTPS event URL prefix for the authorized Meetup group, ending in /events/.
    required: true
  community-event-url-prefixes:
    description: JSON array of nonempty HTTPS prefixes accepted for community event URLs.
    required: true
  asset-folder-url-prefix:
    description: HTTPS prefix accepted for event asset folder URLs.
    required: true
  locale:
    description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
    required: true
  issue-number:
    description: GitHub issue number containing the meetup event document.
    required: true
  github-token:
    description: Token for the caller repository. Requires issues:read and issues:write.
    required: true
  google-credentials:
    description: Service-account JSON with access to the configured Drive parent, template and public folders.
    required: true
  google-drive-folder-id:
    description: Google Drive folder ID of the parent asset folder.
    required: true
  google-drive-public-folder-id:
    description: Google Drive ID of the shared public folder for generated PDFs.
    required: true
  google-drive-template-folder-id:
    description: Google Drive folder ID of the template folder.
    required: true
  conference-hall-event:
    description: Conference Hall CFP slug for live linked profiles and selected proposals.
    required: true
  conference-hall-api-key:
    description: Read-only Conference Hall event API key.
    required: true
outputs:
  drive-files:
    description: JSON map from template kind followed by -link to the corresponding copied file URL.
  slides-ready:
    description: Whether a slides URL exists and its content is copy-only or ready.
  diagnostics:
    description: Redacted JSON diagnostics for asset reconciliation.
runs:
  using: node24
  main: dist/index.js
