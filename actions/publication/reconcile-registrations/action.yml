name: Reconcile event registrations
description: Reconcile event-day participants with OCGroups; currently validates the source and reports blocked while provider operations are unavailable.
inputs:
  locale:
    description: Language for generated reports (en or fr).
    required: true
  github-token:
    description: GitHub token with read access to the event issue.
    required: true
  issue-number:
    description: Open meetup issue with occurrence status held for the selected responses.
    required: true
  registrations-sheet-url:
    description: Google response Sheet URL including the explicit tab gid.
    required: true
  email-column:
    description: Exact email header in the first row of the selected tab.
    required: true
  first-data-row:
    description: First reviewed response row for this event, one-based and at least 2.
    required: true
  last-data-row:
    description: Last reviewed response row inclusive, with at most 1000 selected rows.
    required: true
  google-credentials:
    description: Google service-account JSON with read access to the response Sheet.
    required: true
runs:
  using: node24
  main: dist/index.js
