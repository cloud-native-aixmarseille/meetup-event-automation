name: Reconcile meetup communications
description: Reconcile due meetup communications and dispatch them through the configured mail and Slack gateways when event, checklist, approval and delivery checks pass. Report concise technical facts and diagnostic codes in logs and the job summary.
author: Cloud Native Aix-Marseille
inputs:
  meetup-event-url-prefix:
    description: HTTPS event URL prefix for the authorized Meetup group, ending in /events/.
    required: true
  community-event-url-prefixes:
    description: JSON array of nonempty HTTPS prefixes accepted for community event URLs.
    required: true
  asset-folder-url-prefix:
    description: HTTPS prefix accepted for event asset folder URLs.
    required: true
  locale:
    description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
    required: true
  issue-number:
    description: GitHub issue number in the caller repository containing the meetup event document to inspect.
    required: true
  slides-ready:
    description: Whether managed slides content is ready. False holds email batches that require slides. Copy-only slides use true.
    required: true
  slides-url:
    description: Direct presentation file URL from the asset action's drive-files slides-link entry. Supply on every invocation; it may be empty when slides-ready is false. Unavailable slides block due email batches.
    required: true
  openfeedback-api-key:
    description: OpenFeedback organization API key used to read existing talk results for speaker thank-you emails. Missing or unresolved results block the thank-you batch.
    required: true
  github-token:
    description: Token for the caller repository. Requires issues:write for approval requests, checklist completion and the delivery ledger, and metadata:read to verify approvers.
    required: true
  managed-comment-author:
    description: Trusted bot login allowed to create or update managed approval and delivery ledger comments, for example my-app[bot].
    required: true
  mailings-token:
    description: Token used to dispatch due email communications to the configured mailings repository.
    required: true
  slack-organizer-channel-id:
    description: Internal meetup organizer Slack channel for approval requests and actionable organizer reminders. Public announcement channels are separate.
    required: true
  slack-token:
    description: Slack bot token with chat:write and reactions:write for organizer notifications and decision reactions.
    required: true
  conference-hall-event:
    description: Conference Hall CFP slug for live linked profiles and selected proposals.
    required: true
  conference-hall-api-key:
    description: Read-only Conference Hall event API key.
    required: true
outputs:
  diagnostics:
    description: Redacted JSON diagnostics safe to expose in workflow logs and summaries.
runs:
  using: node24
  main: dist/index.js
