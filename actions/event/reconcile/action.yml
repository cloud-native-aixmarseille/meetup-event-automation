name: Reconcile meetup event
description: Read one meetup issue, derive lifecycle and readiness, and persist safe issue and managed-comment updates. Publish redacted diagnostics in annotations, logs, and the job summary.
author: Cloud Native Aix-Marseille
branding:
  icon: check-circle
  color: blue
inputs:
  locale:
    description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
    required: true
  issue-number:
    description: GitHub issue number in the caller repository containing the meetup event document to inspect.
    required: true
  conference-hall-event:
    description: Conference Hall CFP slug for live linked profiles and selected proposals.
    required: true
  conference-hall-api-key:
    description: Read-only Conference Hall event API key.
    required: true
  github-token:
    description: Token for the caller repository. Requires issues:write for issue normalization and managed diagnostic comments.
    required: true
  managed-comment-author:
    description: Trusted bot login allowed to create or update the managed diagnostic comment, for example my-app[bot].
    required: true
outputs:
  diagnostics:
    description: Redacted JSON diagnostics safe to expose in workflow logs and summaries.
runs:
  using: node24
  main: dist/index.js
