name: List active meetup events
description: List open meetup issue numbers from the caller repository using the configured event label. Publish redacted diagnostics in annotations, logs, and the job summary.
author: Cloud Native Aix-Marseille
inputs:
  locale:
    description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
    required: true
  github-token:
    description: Token for the caller repository with issues:read permission.
    required: true
outputs:
  issue-numbers:
    description: JSON array of open meetup issue numbers selected for downstream workflows.
runs:
  using: node24
  main: dist/index.js
