name: Reconcile slides PDF
description:
  Reconcile the post-event presentation PDF while preserving its identity, source
  revision and export recovery state.
inputs:
  locale:
    description: Language for generated reports (en or fr).
    required: true
  github-token:
    description: GitHub token for reading the consumer repository and event issues.
    required: true
  issue-number:
    description: Meetup issue number.
    required: true
  pdf-source:
    description: Public asset identities and issue revision emitted by document reconciliation.
    required: true
  slides-ready:
    description: Whether the prepared presentation content is ready.
    required: true
  google-credentials:
    description: Service-account JSON with access to the presentation and public PDF folder.
    required: true
  google-drive-public-folder-id:
    description: Public Drive root ID containing the slides subfolder for generated PDFs.
    required: true
outputs:
  diagnostics:
    description: Redacted PDF reconciliation diagnostics for the organizer checklist.
runs:
  using: node24
  main: dist/index.js
