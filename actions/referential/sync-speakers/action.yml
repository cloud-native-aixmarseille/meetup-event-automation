name: Synchronize Conference Hall speakers
description: Prepare a validated private speaker catalog and issue form from one Conference Hall snapshot.
inputs:
  locale:
    description: Language for generated reports (en or fr).
    required: true
  github-token:
    description: Token used to verify the destination repository is private.
    required: true
  conference-hall-event:
    description: Conference Hall CFP slug.
    required: true
  conference-hall-api-key:
    description: Read-only Conference Hall event API key.
    required: true
outputs:
  pr-title:
    description: Localized private synchronization PR title.
  pr-body:
    description: Localized private synchronization PR guidance.
runs:
  using: node24
  main: dist/index.js
