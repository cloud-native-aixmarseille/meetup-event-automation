name: Validate meetup referentials
description: Validate the configured host and speaker catalogs and return only redacted counts and diagnostics. Publish redacted diagnostics in annotations, logs, and the job summary.
author: Cloud Native Aix-Marseille
inputs:
  locale:
    description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
    required: false
    default: en
outputs:
  failure-message:
    description: Localized remediation for a failed workflow check; empty when the check succeeds.
  result:
    description: Versioned redacted JSON envelope containing validation status, public counts, and redacted diagnostics.
  is-valid:
    description: Whether both configured referential catalogs passed validation.
  host-count:
    description: Number of valid host entries exposed to downstream automation; 0 when validation fails.
  speaker-count:
    description: Number of valid speaker entries exposed to downstream automation; 0 when validation fails.
  diagnostics:
    description: Redacted JSON diagnostics safe to expose outside the private catalogs.
runs:
  using: node24
  main: dist/index.js
