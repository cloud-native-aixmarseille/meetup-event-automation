name: Validate meetup referentials
description: Validate host and speaker catalogs and report redacted counts and diagnostic codes. Invalid records block dependent work; only technical failures fail CI.
author: Cloud Native Aix-Marseille
inputs:
  locale:
    description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
    required: true
runs:
  using: node24
  main: dist/index.js
