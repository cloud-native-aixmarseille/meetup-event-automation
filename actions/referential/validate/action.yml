name: Validate meetup referentials
description: Validate the configured host and speaker catalogs and fail when invalid, returning only redacted counts and diagnostics. Publish redacted diagnostics in annotations, logs, and the job summary.
author: Cloud Native Aix-Marseille
inputs:
  locale:
    description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
    required: true
runs:
  using: node24
  main: dist/index.js
