# Goal: Validate consumer catalogs and their public issue-form projection.
# Behavior: Check catalogs and form choices without writing files or opening a PR.
# Report invalid catalogs and form drift as diagnostics; technical failures fail CI.
# Logs and summaries contain concise codes, fields and affected files.

name: Referential / Check catalog and form

on:
  workflow_call:
    inputs:
      locale:
        description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
        required: true
        type: string

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate referentials
        id: referentials
        uses: $/actions/referential/validate
        with:
          locale: ${{ inputs.locale }}

      - name: Check issue form projection
        id: issue-form
        uses: $/actions/issue-form/reconcile
        with:
          locale: ${{ inputs.locale }}
          mode: check
