# Goal: Commit rebuilt bundles to the dependency PR that produced them.
# Behavior: Delegate origin, artifact, path and head validation to the shared writer.
name: Internal - Commit action distributions

on: # zizmor: ignore[dangerous-triggers] The shared writer validates origin and paths without executing PR code.
  workflow_run:
    workflows: [Internal - Rebuild action distributions]
    types: [completed]

permissions: {}

jobs:
  distributions:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/action-distributions.yml@0864018583d79f7e535f572005baa35f2e864849 # 4.1.0
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      working-directories: .
      build-script: package
      ignore-scripts: false
      output-directory: |
        actions/assets/generate-cover/dist
        actions/assets/reconcile-documents/dist
        actions/assets/reconcile-slides-pdf/dist
        actions/communication/generate-linkedin-post/dist
        actions/communication/generate-slack-post/dist
        actions/communication/prepare-reminders/dist
        actions/communication/reconcile-email/dist
        actions/communication/reconcile-social/dist
        actions/communication/recover-social/dist
        actions/event/generate-copy/dist
        actions/event/list-active/dist
        actions/event/reconcile/dist
        actions/feedback/reconcile-event/dist
        actions/feedback/reconcile-short-link/dist
        actions/issue-form/reconcile/dist
        actions/organizer/reconcile-attention/dist
        actions/organizer/reconcile-checklist/dist
        actions/organizer/review-drafts/dist
        actions/publication/prepare-runtime/dist
        actions/publication/reconcile-event/dist
        actions/referential/reconcile-speakers/dist
        actions/referential/validate/dist
      required-files: index.js
      max-artifact-size: 128
      pull-request-authors: '["dependabot"]'
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
