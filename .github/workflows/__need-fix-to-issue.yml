# Goal: Track code fixes as GitHub issues.
# Behavior: Pass main-branch pushes or a manually selected commit range to the
# shared fix-to-issue workflow.

name: Need fix to Issue

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      #checkov:skip=CKV_GHA_7: required
      manual-commit-ref:
        description: "The SHA of the commit to get the diff for."
        required: true
      manual-base-ref:
        description: "The earlier commit SHA to compare with manual-commit-ref."
        required: true

permissions: {}

jobs:
  main:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/need-fix-to-issue.yml@ab69f41f76e77ec84e733dedb03492b3ee95a05f # 0.39.0
    permissions:
      contents: read
      issues: write
    with:
      manual-commit-ref: ${{ inputs.manual-commit-ref }}
      manual-base-ref: ${{ inputs.manual-base-ref }}
