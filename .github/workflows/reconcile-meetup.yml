name: Reconcile meetup
on:
  workflow_call:
    inputs:
      meetup-event-url-prefix:
        description: HTTPS event URL prefix for the authorized Meetup group, ending in /events/.
        required: true
        type: string
      community-event-url-prefixes:
        description: JSON array of nonempty HTTPS prefixes accepted for community event URLs.
        required: true
        type: string
      asset-folder-url-prefix:
        description: HTTPS prefix accepted for event asset folder URLs.
        required: true
        type: string
      locale:
        description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
        required: true
        type: string
      github-app-client-id:
        description: GitHub App client ID used to mint the narrowly scoped installation token for meetup automation.
        required: true
        type: string
      slack-organizer-channel-id:
        description:
          Internal meetup organizer Slack channel for approval requests and actionable organizer reminders. Public announcement channels
          are separate.
        required: true
        type: string
      google-drive-folder-id:
        description: Google Drive folder ID of the parent asset folder used for asset reconciliation.
        required: true
        type: string
      google-drive-public-folder-id:
        description: Google Drive ID of the shared public folder for generated PDFs.
        required: true
        type: string
      google-drive-template-folder-id:
        description: Google Drive folder ID of the template folder used for asset reconciliation.
        required: true
        type: string
      kutt-base-url:
        description: HTTPS base URL of the Kutt instance, without /api/v2. No default.
        required: true
        type: string
      kutt-link-id:
        description: Existing Kutt feedback link API ID.
        required: true
        type: string
      conference-hall-event:
        description: Conference Hall CFP slug for live linked profiles and selected proposals.
        required: true
        type: string
      issue-number:
        description: Meetup issue number.
        type: number
        required: true
    secrets:
      openfeedback-api-key:
        description: OpenFeedback organization API key (`oforg_`) used to create and update events.
        required: true
      kutt-api-key:
        description: API key for the owner of the existing Kutt feedback link.
        required: true
      google-credentials:
        description: Google service-account JSON for Drive asset reconciliation.
        required: true
      github-app-private-key:
        description:
          PEM-encoded private key for the GitHub App identified by the github-app-client-id input. Used to mint a narrowly scoped
          installation token.
        required: true
      slack-token:
        description: Slack bot token with chat:write and reactions:write for organizer notifications and decision reactions.
        required: true
      conference-hall-api-key:
        description: Read-only Conference Hall event API key.
        required: true
permissions: {}
jobs:
  manage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: local-workflow-actions
        uses: hoverkraft-tech/ci-github-common/actions/local-workflow-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22
        with:
          actions-path: actions
      - name: Reconcile event feedback
        id: feedback
        uses: ./../self-workflow/actions/feedback/reconcile-event
        with:
          meetup-event-url-prefix: ${{ inputs.meetup-event-url-prefix }}
          community-event-url-prefixes: ${{ inputs.community-event-url-prefixes }}
          asset-folder-url-prefix: ${{ inputs.asset-folder-url-prefix }}
          conference-hall-event: ${{ inputs.conference-hall-event }}
          conference-hall-api-key: ${{ secrets.conference-hall-api-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          locale: ${{ inputs.locale }}
          issue-number: ${{ inputs.issue-number }}
          github-token: ${{ steps.app-token.outputs.token }}
          openfeedback-api-key: ${{ secrets.openfeedback-api-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
      - name: Reconcile event assets
        id: assets
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' && steps.local-workflow-actions.outcome == 'success' }}
        uses: ./../self-workflow/actions/assets/reconcile-documents
        with:
          meetup-event-url-prefix: ${{ inputs.meetup-event-url-prefix }}
          community-event-url-prefixes: ${{ inputs.community-event-url-prefixes }}
          asset-folder-url-prefix: ${{ inputs.asset-folder-url-prefix }}
          conference-hall-event: ${{ inputs.conference-hall-event }}
          conference-hall-api-key: ${{ secrets.conference-hall-api-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          locale: ${{ inputs.locale }}
          issue-number: ${{ inputs.issue-number }}
          github-token: ${{ steps.app-token.outputs.token }}
          google-credentials: ${{ secrets.google-credentials }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          google-drive-folder-id: ${{ inputs.google-drive-folder-id }}
          google-drive-template-folder-id: ${{ inputs.google-drive-template-folder-id }}
      - name: Reconcile presentation PDF
        id: pdf
        if: ${{ !cancelled() && steps.assets.outputs.pdf-source != '' && steps.assets.outputs.slides-ready != '' }}
        uses: ./../self-workflow/actions/assets/reconcile-slides-pdf
        with:
          locale: ${{ inputs.locale }}
          issue-number: ${{ inputs.issue-number }}
          github-token: ${{ steps.app-token.outputs.token }}
          google-credentials: ${{ secrets.google-credentials }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          google-drive-public-folder-id: ${{ inputs.google-drive-public-folder-id }}
          pdf-source: ${{ steps.assets.outputs.pdf-source }}
          slides-ready: ${{ steps.assets.outputs.slides-ready }}
      - name: Reconcile event
        id: event
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' && steps.local-workflow-actions.outcome == 'success' }}
        uses: ./../self-workflow/actions/event/reconcile
        with:
          meetup-event-url-prefix: ${{ inputs.meetup-event-url-prefix }}
          community-event-url-prefixes: ${{ inputs.community-event-url-prefixes }}
          asset-folder-url-prefix: ${{ inputs.asset-folder-url-prefix }}
          conference-hall-event: ${{ inputs.conference-hall-event }}
          conference-hall-api-key: ${{ secrets.conference-hall-api-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          locale: ${{ inputs.locale }}
          issue-number: ${{ inputs.issue-number }}
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Create mailings GitHub App token
        id: mailings-token
        if: ${{ !cancelled() && steps.assets.outputs.drive-files != '' && steps.assets.outputs.slides-ready != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          owner: ${{ github.repository_owner }}
          repositories: mailings
          permission-contents: write
      - name: Reconcile communications
        id: communications
        if:
          ${{ !cancelled() && steps.assets.outputs.drive-files != '' && steps.assets.outputs.slides-ready != '' && steps.mailings-token.outcome ==
          'success' }}
        uses: ./../self-workflow/actions/communication/reconcile-email
        with:
          meetup-event-url-prefix: ${{ inputs.meetup-event-url-prefix }}
          community-event-url-prefixes: ${{ inputs.community-event-url-prefixes }}
          asset-folder-url-prefix: ${{ inputs.asset-folder-url-prefix }}
          conference-hall-event: ${{ inputs.conference-hall-event }}
          conference-hall-api-key: ${{ secrets.conference-hall-api-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          slides-ready: ${{ steps.assets.outputs.slides-ready }}
          slides-url: ${{ fromJSON(steps.assets.outputs.drive-files)['slides-link'] }}
          openfeedback-api-key: ${{ secrets.openfeedback-api-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          locale: ${{ inputs.locale }}
          issue-number: ${{ inputs.issue-number }}
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          mailings-token: ${{ steps.mailings-token.outputs.token }}
          slack-organizer-channel-id: ${{ inputs.slack-organizer-channel-id }}
          slack-token: ${{ secrets.slack-token }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
    outputs:
      initialized: ${{ steps.app-token.outcome == 'success' && steps.local-workflow-actions.outcome == 'success' }}
      event-outcome: ${{ steps.event.outcome }}
      event-diagnostics: ${{ steps.event.outputs.diagnostics }}
      assets-outcome: ${{ steps.assets.outcome }}
      assets-diagnostics: ${{ steps.assets.outputs.diagnostics }}
      pdf-outcome: ${{ steps.pdf.outcome }}
      pdf-diagnostics: ${{ steps.pdf.outputs.diagnostics }}
      feedback-outcome: ${{ steps.feedback.outcome }}
      feedback-diagnostics: ${{ steps.feedback.outputs.diagnostics }}
      communications-outcome: ${{ steps.communications.outcome }}
      communications-diagnostics: ${{ steps.communications.outputs.diagnostics }}
  feedback-link:
    needs: manage
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/reconcile-feedback-link.yml
    permissions:
      contents: read
    with:
      locale: ${{ inputs.locale }}
      github-app-client-id: ${{ inputs.github-app-client-id }}
      kutt-base-url: ${{ inputs.kutt-base-url }}
      kutt-link-id: ${{ inputs.kutt-link-id }}
    secrets:
      github-app-private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
      kutt-api-key: ${{ secrets.kutt-api-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
  report:
    needs:
      - manage
      - feedback-link
    if: ${{ always() && needs.manage.outputs.initialized == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: local-workflow-actions
        uses: hoverkraft-tech/ci-github-common/actions/local-workflow-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22
        with:
          actions-path: actions
      - name: Reconcile organizer checklist
        id: checklist
        uses: ./../self-workflow/actions/organizer/reconcile-checklist
        with:
          locale: ${{ inputs.locale }}
          issue-number: ${{ inputs.issue-number }}
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          stage-results:
            '{"event":{"outcome":${{ toJSON(needs.manage.outputs.event-outcome) }},"diagnostics":${{
            toJSON(needs.manage.outputs.event-diagnostics) }}},"assets":[{"outcome":${{ toJSON(needs.manage.outputs.assets-outcome)
            }},"diagnostics":${{ toJSON(needs.manage.outputs.assets-diagnostics) }}},{"outcome":${{ toJSON(needs.manage.outputs.pdf-outcome)
            }},"diagnostics":${{ toJSON(needs.manage.outputs.pdf-diagnostics) }}}],"feedback":[{"outcome":${{
            toJSON(needs.manage.outputs.feedback-outcome) }},"diagnostics":${{ toJSON(needs.manage.outputs.feedback-diagnostics)
            }}},{"outcome":${{ toJSON(needs.feedback-link.outputs.outcome) }},"diagnostics":${{
            toJSON(needs.feedback-link.outputs.diagnostics) }}}],"communications":{"outcome":${{
            toJSON(needs.manage.outputs.communications-outcome) }},"diagnostics":${{ toJSON(needs.manage.outputs.communications-diagnostics)
            }}}}'
      - name: Reconcile organizer attention
        id: attention
        if: ${{ !cancelled() && steps.checklist.outcome == 'success' }}
        uses: ./../self-workflow/actions/organizer/reconcile-attention
        with:
          meetup-event-url-prefix: ${{ inputs.meetup-event-url-prefix }}
          community-event-url-prefixes: ${{ inputs.community-event-url-prefixes }}
          asset-folder-url-prefix: ${{ inputs.asset-folder-url-prefix }}
          locale: ${{ inputs.locale }}
          issue-number: ${{ inputs.issue-number }}
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          slack-organizer-channel-id: ${{ inputs.slack-organizer-channel-id }}
          slack-token: ${{ secrets.slack-token }} # zizmor: ignore[secrets-outside-env] reusable workflow forwards explicitly scoped credentials
          stage-results:
            '{"event":{"outcome":${{ toJSON(needs.manage.outputs.event-outcome) }},"diagnostics":${{
            toJSON(needs.manage.outputs.event-diagnostics) }}},"assets":[{"outcome":${{ toJSON(needs.manage.outputs.assets-outcome)
            }},"diagnostics":${{ toJSON(needs.manage.outputs.assets-diagnostics) }}},{"outcome":${{ toJSON(needs.manage.outputs.pdf-outcome)
            }},"diagnostics":${{ toJSON(needs.manage.outputs.pdf-diagnostics) }}}],"feedback":[{"outcome":${{
            toJSON(needs.manage.outputs.feedback-outcome) }},"diagnostics":${{ toJSON(needs.manage.outputs.feedback-diagnostics)
            }}},{"outcome":${{ toJSON(needs.feedback-link.outputs.outcome) }},"diagnostics":${{
            toJSON(needs.feedback-link.outputs.diagnostics) }}}],"communications":{"outcome":${{
            toJSON(needs.manage.outputs.communications-outcome) }},"diagnostics":${{ toJSON(needs.manage.outputs.communications-diagnostics)
            }}}}'
concurrency:
  group: ${{ format('meetup-event-{0}-{1}', github.repository_id, inputs.issue-number) }}
  cancel-in-progress: false
