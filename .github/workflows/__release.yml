# Goal: Publish automation releases weekly or on manual request.
# Behavior: Validate the default branch, plan the next semantic version, then
# publish with a Gemini changelog summary only when release changes exist.

name: Internal - Release

on:
  workflow_dispatch:
  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  release:
    name: Create and publish release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # App-authenticated tags trigger the main CI documentation workflow.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] CI bot authentication triggers tag workflows
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: read

      - name: Plan release
        id: plan-release
        uses: hoverkraft-tech/ci-github-publish/actions/release/plan@4d906685a32df3cfab9139296d49dd914a86bafd # 1.0.2
        with:
          target-sha: ${{ github.sha }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Create and publish release
        if: steps.plan-release.outputs.has-changes == 'true' && steps.plan-release.outputs.tag != ''
        uses: hoverkraft-tech/ci-github-publish/actions/release/create@4d906685a32df3cfab9139296d49dd914a86bafd # 1.0.2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # zizmor: ignore[secrets-outside-env] Gemini credential is scoped to release summarization
        with:
          tag: ${{ steps.plan-release.outputs.tag }}
          target-sha: ${{ github.sha }}
          publish: "true"
          changelog-summary: |
            {
              "llmAuth": ${{ toJSON(env.GEMINI_API_KEY) }},
              "llmProvider": "google-genai",
              "llmModel": "gemini-3.8-flash"
            }
          github-token: ${{ steps.app-token.outputs.token }}
