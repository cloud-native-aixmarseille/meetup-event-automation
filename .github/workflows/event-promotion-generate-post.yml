# Goal: Prepare public announcements or reminders for configured destinations.
# Behavior: Resolve one destination or all destinations from meetup-social.json,
# then generate, review and report each draft sequentially under one event lock.
# Promotion reconciliation publishes posts after separate publication approvals.

name: Event / Promotion / Generate post
on:
  workflow_call:
    inputs:
      meetup-event-url-prefix:
        description: HTTPS event URL prefix for the authorized Meetup group, ending in /events/.
        required: true
        type: string
      community-event-url-prefixes:
        description: JSON array of nonempty HTTPS prefixes accepted for community event URLs.
        required: true
        type: string
      asset-folder-url-prefix:
        description: HTTPS prefix accepted for event asset folder URLs.
        required: true
        type: string
      locale:
        description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
        required: true
        type: string
      issue-number:
        description: Meetup issue number.
        required: true
        type: number
      conference-hall-event:
        description: Conference Hall CFP slug for live linked profiles and selected proposals.
        required: true
        type: string
      google-drive-public-folder-id:
        description: Public Drive root ID containing the tmp-covers subfolder for content images.
        required: true
        type: string
      slack-organizer-channel-id:
        description: Internal organizer channel receiving content reviews.
        required: true
        type: string
      target:
        description: "Draft selector: a configured destination key or * for all destinations, followed by :announcement, :d7, or :d0."
        required: true
        type: string
      ai-provider:
        description: AI provider identifier (gemini).
        required: true
        type: string
      ai-model:
        description: Supported structured-text model.
        required: true
        type: string
      github-app-client-id:
        description: GitHub App client ID for the consumer repository.
        required: true
        type: string
    secrets:
      conference-hall-api-key:
        description: Read-only Conference Hall event API key.
        required: true
      google-credentials:
        description: Google service-account JSON for immutable public content media.
        required: true
      slack-token:
        description: Slack bot token for organizer review requests and decision reactions.
        required: true
      ai-api-key:
        description: API key for the selected AI provider.
        required: true
      github-app-private-key:
        description: GitHub App private key.
        required: true
permissions: {}
jobs:
  destinations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.selection.outputs.targets }}
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select configured promotion drafts
        id: selection
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const selector = process.env.REQUESTED_TARGET;
          if (!/^(\*|[a-z][a-z0-9-]{0,63}):(announcement|d7|d0)$/.test(selector)) throw new Error('Unsupported promotion draft target');
          let configuration;
          try { configuration = JSON.parse(readFileSync('.github/meetup-social.json', 'utf8')); }
          catch { throw new Error('Invalid social publication configuration'); }
          const destinations = configuration?.destinations;
          if (configuration?.version !== 1 || !Array.isArray(destinations) || destinations.length > 50) throw new Error('Invalid social publication configuration');
          const keys = new Set();
          for (const destination of destinations) {
            if (!destination || typeof destination.key !== 'string' || !/^[a-z][a-z0-9-]{0,63}$/.test(destination.key) || !['slack', 'linkedin'].includes(destination.provider) || keys.has(destination.key)) throw new Error('Invalid or duplicate promotion destination');
            keys.add(destination.key);
          }
          const [key, purpose] = selector.split(':');
          const selected = key === '*' ? destinations : destinations.filter(destination => destination.key === key);
          if (key !== '*' && selected.length !== 1) throw new Error('Unsupported promotion draft target');
          const targets = selected.map(destination => ({ target: `${destination.key}:${purpose}`, provider: destination.provider }));
          appendFileSync(process.env.GITHUB_OUTPUT, 'targets=' + JSON.stringify(targets) + '\n');
          NODE
  generate:
    needs: destinations
    if: ${{ needs.destinations.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.destinations.outputs.targets) }}
    uses: $/.github/workflows/__event-promotion-generate-post.yml
    permissions:
      contents: read
    with:
      meetup-event-url-prefix: ${{ inputs.meetup-event-url-prefix }}
      community-event-url-prefixes: ${{ inputs.community-event-url-prefixes }}
      asset-folder-url-prefix: ${{ inputs.asset-folder-url-prefix }}
      locale: ${{ inputs.locale }}
      issue-number: ${{ inputs.issue-number }}
      conference-hall-event: ${{ inputs.conference-hall-event }}
      google-drive-public-folder-id: ${{ inputs.google-drive-public-folder-id }}
      slack-organizer-channel-id: ${{ inputs.slack-organizer-channel-id }}
      target: ${{ matrix.target }}
      ai-provider: ${{ inputs.ai-provider }}
      ai-model: ${{ inputs.ai-model }}
      github-app-client-id: ${{ inputs.github-app-client-id }}
      provider: ${{ matrix.provider }}
    secrets:
      conference-hall-api-key: ${{ secrets.conference-hall-api-key }} # zizmor: ignore[secrets-outside-env] explicitly scoped reusable workflow credentials
      google-credentials: ${{ secrets.google-credentials }} # zizmor: ignore[secrets-outside-env] explicitly scoped reusable workflow credentials
      slack-token: ${{ secrets.slack-token }} # zizmor: ignore[secrets-outside-env] explicitly scoped reusable workflow credentials
      ai-api-key: ${{ secrets.ai-api-key }} # zizmor: ignore[secrets-outside-env] explicitly scoped reusable workflow credentials
      github-app-private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] explicitly scoped reusable workflow credentials
concurrency:
  group: ${{ format('meetup-event-{0}-{1}', github.repository_id, inputs.issue-number) }}
  cancel-in-progress: false
