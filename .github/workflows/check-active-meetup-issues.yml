# Reusable workflow that checks active meetup issues, evaluates their current
# state, and processes due communications under the shared per-event lock.
name: Check active meetup issues

on:
  workflow_call:
    inputs:
      locale:
        description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
        required: false
        type: string
        default: en
      github-app-id:
        description: GitHub App ID used to mint the narrowly scoped installation token for meetup automation.
        required: true
        type: string
      slack-channel-id:
        description: Slack channel ID used for approved notifications.
        required: true
        type: string
      google-drive-meetup-folder-id:
        description: Google Drive folder ID of the parent meetup folder used for asset reconciliation.
        required: true
        type: string
      google-drive-meetup-template-folder-id:
        description: Google Drive folder ID of the template folder used for asset reconciliation.
        required: true
        type: string
    outputs:
      issue-numbers:
        description: JSON array of meetup issue numbers selected for audit during the listing phase.
        value: ${{ jobs.list.outputs.issue-numbers }}
    secrets:
      google-credentials:
        description: Google service-account JSON for Drive asset reconciliation.
        required: true
      github-app-private-key:
        description: PEM-encoded private key for the GitHub App identified by the github-app-id input. Used to mint a narrowly scoped installation token.
        required: true
      mailings-token:
        description: Token used to dispatch approved email communications to the configured mailings repository.
        required: true
      slack-token:
        description: Slack bot token used for approved notifications.
        required: true

permissions: {}

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      issue-numbers: ${{ steps.list.outputs.issue-numbers }}
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: local-workflow-actions
        uses: hoverkraft-tech/ci-github-common/actions/local-workflow-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
        with:
          actions-path: actions

      - name: List active events
        id: list
        uses: ./../self-workflow/actions/event/list-active
        with:
          locale: ${{ inputs.locale }}
          github-token: ${{ github.token }}

  audit:
    needs: list
    if: needs.list.outputs.issue-numbers != '' && needs.list.outputs.issue-numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        issue-number: ${{ fromJSON(needs.list.outputs.issue-numbers) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: meetup-event-${{ github.repository_id }}-${{ matrix.issue-number }}
      cancel-in-progress: false
    steps:
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.github-app-id }}
          private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] reusable workflows cannot safely consume environment secrets without broad inherit; this workflow forwards only the required secret
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write

      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: local-workflow-actions
        uses: hoverkraft-tech/ci-github-common/actions/local-workflow-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
        with:
          actions-path: actions

      - name: Reconcile event assets
        id: assets
        uses: ./../self-workflow/actions/publication/reconcile-assets
        with:
          locale: ${{ inputs.locale }}
          issue-number: ${{ matrix.issue-number }}
          mode: fix
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          google-credentials: ${{ secrets.google-credentials }} # zizmor: ignore[secrets-outside-env] required reusable-workflow secret is forwarded explicitly
          google-drive-meetup-folder-id: ${{ inputs.google-drive-meetup-folder-id }}
          google-drive-meetup-template-folder-id: ${{ inputs.google-drive-meetup-template-folder-id }}

      - name: Evaluate current event state
        id: event
        uses: ./../self-workflow/actions/event/reconcile
        with:
          locale: ${{ inputs.locale }}
          issue-number: ${{ matrix.issue-number }}
          mode: check
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}

      - name: Reconcile communications
        id: communications
        uses: ./../self-workflow/actions/communication/reconcile
        with:
          locale: ${{ inputs.locale }}
          issue-number: ${{ matrix.issue-number }}
          mode: dispatch
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          mailings-token: ${{ secrets.mailings-token }} # zizmor: ignore[secrets-outside-env] required reusable-workflow secret is forwarded explicitly to avoid secrets: inherit
          slack-channel-id: ${{ inputs.slack-channel-id }}
          slack-token: ${{ secrets.slack-token }} # zizmor: ignore[secrets-outside-env] required reusable-workflow secret is forwarded explicitly to avoid secrets: inherit
          dispatch-authorized: "true"
