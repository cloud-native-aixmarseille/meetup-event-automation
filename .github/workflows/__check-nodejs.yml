# Goal: Validate and package the TypeScript workspace.
# Behavior: Delegate Node.js CI to the shared workflow, build workspace projects
# and action bundles, and run tests with Codecov coverage reporting.

name: Internal - Checks for nodejs

on:
  workflow_call:

permissions: {}

jobs:
  test-nodejs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@1f81dd00d941680ab227a6eae5378790d6242e02 # 1.0.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      build: |
        workspace:build
        package
      test: |
        {"coverage":"codecov"}
