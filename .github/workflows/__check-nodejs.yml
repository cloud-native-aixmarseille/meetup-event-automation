# Goal: Validate and package the TypeScript workspace.
# Behavior: Delegate configured CodeQL analysis and Node.js checks to the shared
# workflow, and build and test the workspace with Codecov reporting.

name: Internal - Checks for nodejs

on:
  workflow_call:

permissions: {}

jobs:
  test-nodejs:
    # Validate upstream PR #557; pin its released revision before merging.
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@c50db00593f693ca6d3a1eade308785bdb86034d
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      code-ql-config-file: ./.github/codeql/config.yml
      build: |
        workspace:build
        package
      test: |
        {"coverage":"codecov"}
