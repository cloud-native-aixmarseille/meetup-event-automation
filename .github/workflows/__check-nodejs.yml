# Goal: Validate and package the TypeScript workspace.
# Behavior: Analyze authored JavaScript/TypeScript, delegate Node.js checks to the
# shared workflow, and build and test the workspace with Codecov reporting.

name: Internal - Checks for nodejs

on:
  workflow_call:

permissions: {}

jobs:
  code-ql:
    name: 🛡️ CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  test-nodejs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@1f81dd00d941680ab227a6eae5378790d6242e02 # 1.0.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      # The shared workflow cannot pass a CodeQL configuration file. Run the
      # configured job above instead of scanning the generated bundles again.
      code-ql: ""
      build: |
        workspace:build
        package
      test: |
        {"coverage":"codecov"}
