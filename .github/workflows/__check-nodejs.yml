# Goal: Validate and package the TypeScript workspace.
# Behavior: Delegate configured CodeQL analysis and Node.js checks to the shared
# workflow, and build and test the workspace with Codecov reporting.

name: Internal - Checks for nodejs

on:
  workflow_call:

permissions: {}

jobs:
  test-nodejs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@97f64bc080b78daca8fb3ece49de448aaac83429 # 1.1.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      code-ql: |
        {
          "languages": "javascript-typescript",
          "config-file": "./.github/codeql/config.yml"
        }
      build: |
        workspace:build
        package
      test: |
        {"coverage":"codecov"}
