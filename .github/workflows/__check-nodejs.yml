# Goal: Validate and package the TypeScript workspace.
# Behavior: Delegate configured CodeQL analysis and Node.js checks to the shared
# workflow, and build and test the workspace with Codecov reporting.

name: Internal - Checks for nodejs

on:
  workflow_call:

permissions: {}

jobs:
  test-nodejs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@98d91b1cc347efc64cd5fb20bc0ebc076acad114 # 3.1.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      # Preserve the installation hooks approved in pnpm-workspace.yaml.
      ignore-scripts: false
      code-ql: |
        {
          "languages": "javascript-typescript",
          "config-file": "./.github/codeql/config.yml"
        }
      build: |
        workspace:build
        package
      test: |
        {"command":"test:ci","coverage":"codecov","report-file":"junit.xml,coverage/lcov.info","shards":2}
