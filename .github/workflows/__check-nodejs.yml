# Goal: Validate and package the TypeScript workspace.
# Behavior: Delegate configured CodeQL analysis and Node.js checks to the shared
# workflow, and build and test the workspace with Codecov reporting.

name: Internal - Checks for nodejs

on:
  workflow_call:

permissions: {}

jobs:
  test-nodejs:
    # Validate upstream PR #557; pin its released revision before merging.
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@298790a342ce32dbbf8f24ab7cf1dd5a5f6d6c7f
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      code-ql: |
        {
          "languages": "javascript-typescript",
          "config-file": "./.github/codeql/config.yml"
        }
      build: |
        workspace:build
        package
      test: |
        {"coverage":"codecov"}
