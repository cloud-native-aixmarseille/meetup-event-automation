# Goal: Validate and package the TypeScript workspace.
# Behavior: Delegate configured CodeQL analysis and Node.js checks to the shared
# workflow, and build and test the workspace with Codecov reporting.

name: Internal - Checks for nodejs

on:
  workflow_call:

permissions: {}

jobs:
  test-nodejs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@fbd3522b68c55a6314aadbededaa487825ba9b35 # 3.0.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      # Preserve the installation hooks approved in pnpm-workspace.yaml.
      ignore-scripts: false
      code-ql: |
        {
          "languages": "javascript-typescript",
          "config-file": "./.github/codeql/config.yml"
        }
      build: |
        workspace:build
        package
      test: |
        {"coverage":"codecov"}
