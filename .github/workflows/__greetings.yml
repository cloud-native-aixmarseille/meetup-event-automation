# Goal: Welcome issue and pull request authors.
# Behavior: Delegate new issues and pull requests targeting main to the shared
# greetings workflow.

name: Greetings

on:
  issues:
    types: [opened]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  greetings:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/greetings.yml@0864018583d79f7e535f572005baa35f2e864849 # 4.1.0
    permissions:
      contents: read
      issues: write
      pull-requests: write
