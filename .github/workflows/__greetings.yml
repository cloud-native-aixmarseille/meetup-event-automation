# Goal: Welcome issue and pull request authors.
# Behavior: Delegate new issues and pull requests targeting main to the shared
# greetings workflow.

name: Greetings

on:
  issues:
    types: [opened]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  greetings:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/greetings.yml@f165c0ca3e88604611481e1408ace1e0e3a5ee47 # 4.3.1
    permissions:
      contents: read
      issues: write
      pull-requests: write
