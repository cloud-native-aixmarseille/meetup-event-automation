# Goal: Validate proposed automation changes before merging.
# Behavior: Run shared CI for pull requests targeting any branch and for merge
# queue groups.

name: Pull request - Continuous Integration

on:
  merge_group:
  pull_request: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
