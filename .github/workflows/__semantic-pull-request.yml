# Goal: Keep pull request titles consistent with Conventional Commits.
# Behavior: Run the shared semantic title check when a pull request is opened,
# edited or synchronized.

name: "Pull Request - Semantic Lint"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions: {}

jobs:
  main:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/semantic-pull-request.yml@d07ee49b460ae2f3815804b5153fe918092aa321 # 4.2.0
    permissions:
      contents: read
