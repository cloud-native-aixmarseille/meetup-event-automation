# Goal: Keep pull request titles consistent with Conventional Commits.
# Behavior: Run the shared semantic title check when a pull request is opened,
# edited or synchronized.

name: "Pull Request - Semantic Lint"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions: {}

jobs:
  main:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/semantic-pull-request.yml@f165c0ca3e88604611481e1408ace1e0e3a5ee47 # 4.3.1
    permissions:
      contents: read
