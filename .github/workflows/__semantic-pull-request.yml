# Goal: Keep pull request titles consistent with Conventional Commits.
# Behavior: Run the shared semantic title check when a pull request is opened,
# edited or synchronized.

name: "Pull Request - Semantic Lint"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions: {}

jobs:
  main:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/semantic-pull-request.yml@0864018583d79f7e535f572005baa35f2e864849 # 4.1.0
    permissions:
      contents: read
