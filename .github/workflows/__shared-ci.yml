name: Common Continuous Integration tasks

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      # The Node.js checks use Biome from the repository lockfile.
      linter-env: |
        VALIDATE_BIOME_FORMAT=false
        VALIDATE_BIOME_LINT=false

  check-nodejs:
    name: Test nodejs
    needs: linter
    uses: ./.github/workflows/__check-nodejs.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  check-dist:
    name: Check action bundles
    needs: linter
    uses: ./.github/workflows/__check-dist.yml
    permissions:
      contents: read

  check-actions:
    name: Integration test actions
    needs: [check-nodejs, check-dist]
    uses: ./.github/workflows/__check-actions.yml
    permissions:
      contents: read
      issues: write

  check-hcaptcha-solver:
    name: Test hCaptcha resolver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install solver dependencies and test
        working-directory: packages/adapter/hcaptcha-captcha-resolver/python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .venv/bin/python -m unittest discover -p '*_test.py'
