# Goal: Apply the same quality gates to pull request and release CI.
# Behavior: Coordinate linting, Node.js checks, bundle verification and action
# integration tests, alongside the Python challenge solver's lock and unit tests.

name: Common Continuous Integration tasks

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@ab69f41f76e77ec84e733dedb03492b3ee95a05f # 0.39.0
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      # The Node.js checks use Biome from the repository lockfile.
      linter-env: |
        VALIDATE_BIOME_FORMAT=false
        VALIDATE_BIOME_LINT=false

  check-nodejs:
    name: Test nodejs
    needs: linter
    uses: ./.github/workflows/__check-nodejs.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  check-dist:
    name: Check action bundles
    needs: linter
    uses: ./.github/workflows/__check-dist.yml
    permissions:
      contents: read

  check-actions:
    name: Integration test actions
    needs: [check-nodejs, check-dist]
    uses: ./.github/workflows/__check-actions.yml
    permissions:
      contents: read
      issues: write

  check-hcaptcha-solver:
    name: Test hCaptcha resolver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check solver dependency lock
        working-directory: packages/adapter/browser-authentication/hcaptcha-captcha-resolver/python
        run: |
          python -m venv .venv-lock
          .venv-lock/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          .venv-lock/bin/pip-compile --strip-extras requirements.in
          git diff --exit-code -- requirements.txt
      - name: Install solver dependencies and test
        working-directory: packages/adapter/browser-authentication/hcaptcha-captcha-resolver/python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .venv/bin/python -m pip check
          .venv/bin/python -m unittest discover -p '*_test.py'
