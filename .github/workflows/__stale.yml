# Goal: Surface inactive issues and pull requests.
# Behavior: Run the shared stale-item policy daily to mark inactive discussions.

name: Mark stale issues and pull requests

on:
  schedule:
    - cron: "30 1 * * *"

permissions: {}

jobs:
  main:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/stale.yml@0864018583d79f7e535f572005baa35f2e864849 # 4.1.0
    permissions:
      issues: write
      pull-requests: write
