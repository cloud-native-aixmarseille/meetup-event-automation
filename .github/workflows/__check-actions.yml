# Goal: Verify packaged actions through GitHub Actions integration tests.
# Behavior: Exercise actions with synthetic fixtures, check outputs and rejected
# configurations, then close the temporary meetup issue even after failures.

name: Internal - Integration tests for actions

on:
  workflow_call:

permissions: {}

env:
  ISSUE_LABEL: integration-test-meetup
  SPEAKER_CONFIRMATION_LABEL: integration-test-speakers-confirmed
  EVENT_DATE: "2099-06-08"

jobs:
  prepare-synthetic-issue:
    name: Prepare synthetic meetup issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      issue-number: ${{ steps.create-issue.outputs.issue-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure synthetic labels exist
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = [...new Set([
              'meetup',
              'speakers:confirmed',
              process.env.ISSUE_LABEL,
              process.env.SPEAKER_CONFIRMATION_LABEL,
            ])];

            for (const name of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: '0366d6',
                  description: 'Synthetic integration test label',
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

      - name: Create synthetic meetup issue
        id: create-issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = `<!-- meetup-event-schema:1 -->
            <!-- meetup-event-references:{"schemaVersion":2,"host":{"id":"host-0001","displayName":"Public Venue"},"speakers":[{"id":"speaker-0001","displayName":"Ada Speaker"}]} -->
            ### Event Title

            Platform Night

            ### Event Date

            ${process.env.EVENT_DATE}

            ### Hoster

            Public Venue [host-0001]

            ### Event Description

            Public event description.

            ### Agenda

            - Ada Speaker [speaker-0001]: A public talk

            ### Meetup Link

            https://www.meetup.com/example-group/events/123

            ### CNCF Link

            https://community.example.test/events/platform-night

            ### Drive Link

            https://drive.google.com/drive/folders/public-event-assets

            ### Communication

            - [x] Meetup event published
            - [x] Mail introduction
            `;
            const labels = [...new Set([
              process.env.ISSUE_LABEL,
              process.env.SPEAKER_CONFIRMATION_LABEL,
              'meetup',
              'speakers:confirmed',
            ])];
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Meetup] - ${process.env.EVENT_DATE} - Platform Night`,
              body,
              labels,
            });

            core.setOutput('issue-number', String(issue.data.number));

      - name: Wait for synthetic meetup issue visibility
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue-number }}
        with:
          script: |
            const { resolve } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { waitForSyntheticIssue } = await import(
              pathToFileURL(resolve('tests/integration/github-actions/wait-for-synthetic-issue.mjs')).href
            );
            await waitForSyntheticIssue({
              github,
              ...context.repo,
              issueNumber: Number(process.env.ISSUE_NUMBER),
            });

  test-referential-validate:
    name: Test referential validate action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare synthetic consumer workspace
        shell: bash
        run: |
          mkdir -p .github/ISSUE_TEMPLATE referentials

          cat > referentials/hosting.csv <<'EOF'
          host_id,name,contact_id,contact,mail,phone,venue_address,venue_postal_code,venue_city
          host-0001,Public Venue,contact-0001,Private Host Contact,host@example.invalid,,1 Example Street,13001,Marseille
          EOF

          cat > referentials/speakers.csv <<'EOF'
          speaker_id,firstname,lastname,company,mail,phone
          speaker-0001,Ada,Speaker,Public Company,speaker@example.invalid,
          EOF

      - name: Validate referentials
        id: validate-referentials
        uses: $/actions/referential/validate
        with:
          locale: en

      - name: Assert referential validation
        shell: bash
        env:
          OUTCOME: ${{ steps.validate-referentials.outcome }}
        run: test "$OUTCOME" = success

  test-issue-form-reconcile:
    name: Test issue form reconciliation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare synthetic consumer workspace
        shell: bash
        run: |
          mkdir -p .github/ISSUE_TEMPLATE referentials

          cat > referentials/hosting.csv <<'EOF'
          host_id,name,contact_id,contact,mail,phone,venue_address,venue_postal_code,venue_city
          host-0001,Public Venue,contact-0001,Private Host Contact,host@example.invalid,,1 Example Street,13001,Marseille
          EOF

          cat > referentials/speakers.csv <<'EOF'
          speaker_id,firstname,lastname,company,mail,phone
          speaker-0001,Ada,Speaker,Public Company,speaker@example.invalid,
          EOF

          cat > .github/ISSUE_TEMPLATE/meetup.yml <<'EOF'
          name: Meetup
          description: Gather event data
          title: "[Meetup]"
          labels:
            - meetup
          body:
            - type: input
              id: event_title
              attributes:
                label: Event Title
                custom-property: preserved
            - type: dropdown
              id: hoster
              attributes:
                label: Hoster
                options:
                  - Old Host
            - type: markdown
              attributes:
                value: |-
                  <!-- Available speakers -->
                  <!--
                  Old Speaker
                  -->
            - type: textarea
              id: unrelated
              attributes:
                label: Unrelated field
                description: Must survive synchronization
          EOF

      - name: Synchronize issue form
        id: sync-issue-form
        uses: $/actions/issue-form/reconcile
        with:
          locale: en
          mode: fix

      - name: Assert issue form synchronization
        shell: bash
        env:
          CHANGED: ${{ steps.sync-issue-form.outputs.changed }}
        run: |
          [[ "$CHANGED" == "true" ]]
          grep -Fq 'Public Venue' .github/ISSUE_TEMPLATE/meetup.yml
          grep -Fq 'Ada Speaker' .github/ISSUE_TEMPLATE/meetup.yml
          if grep -Fq '[host-0001]' .github/ISSUE_TEMPLATE/meetup.yml; then exit 1; fi
          if grep -Fq 'speaker-0001' .github/ISSUE_TEMPLATE/meetup.yml; then exit 1; fi
          if grep -Fq 'Private Host Contact' .github/ISSUE_TEMPLATE/meetup.yml; then exit 1; fi
          if grep -Fq 'host@example.invalid' .github/ISSUE_TEMPLATE/meetup.yml; then exit 1; fi
          if grep -Fq 'speaker@example.invalid' .github/ISSUE_TEMPLATE/meetup.yml; then exit 1; fi
          if grep -Fq 'event_status' .github/ISSUE_TEMPLATE/meetup.yml; then exit 1; fi

  test-event-list-active:
    name: Test event list active action
    needs: prepare-synthetic-issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare synthetic consumer workspace
        shell: bash
        run: |
          mkdir -p .github referentials

      - name: List active meetup issues
        id: list-active
        uses: $/actions/event/list-active
        with:
          locale: en
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert active meetup listing
        shell: bash
        env:
          ISSUE_NUMBER: ${{ needs.prepare-synthetic-issue.outputs.issue-number }}
          ISSUE_NUMBERS: ${{ steps.list-active.outputs.issue-numbers }}
        run: |
          jq -e --argjson issue "$ISSUE_NUMBER" 'index($issue) != null' <<< "$ISSUE_NUMBERS" >/dev/null

  test-event-reconcile:
    name: Test event reconcile action
    needs: prepare-synthetic-issue
    runs-on: ubuntu-latest
    # Removing the constant mode input makes this test write the same synthetic
    # issue as the communication test, so both must use its existing event lock.
    concurrency:
      group: meetup-event-${{ github.repository_id }}-${{ needs.prepare-synthetic-issue.outputs.issue-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare synthetic consumer workspace
        shell: bash
        run: |
          mkdir -p .github referentials

          cat > referentials/hosting.csv <<'EOF'
          host_id,name,contact_id,contact,mail,phone,venue_address,venue_postal_code,venue_city
          host-0001,Public Venue,contact-0001,Private Host Contact,host@example.invalid,,1 Example Street,13001,Marseille
          EOF

          cat > referentials/speakers.csv <<'EOF'
          speaker_id,firstname,lastname,company,mail,phone
          speaker-0001,Ada,Speaker,Public Company,speaker@example.invalid,
          EOF

      - name: Reconcile synthetic meetup event
        id: reconcile-event
        uses: $/actions/event/reconcile
        with:
          conference-hall-event-url: https://conference-hall.io/team/synthetic-team/synthetic-cfp
          meetup-event-url-prefix: https://www.meetup.com/example-group/events/
          community-event-url-prefixes: '["https://community.example.test/events/"]'
          asset-folder-url-prefix: https://drive.google.com/drive/folders/
          locale: en
          conference-hall-event: synthetic-cfp
          conference-hall-api-key: synthetic-key
          issue-number: ${{ needs.prepare-synthetic-issue.outputs.issue-number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert event reconciliation
        shell: bash
        env:
          DIAGNOSTICS: ${{ steps.reconcile-event.outputs.diagnostics }}
        run: |
          [[ "$DIAGNOSTICS" == "[]" ]]

  test-communication-reconcile:
    name: Test communication reconcile action
    needs: prepare-synthetic-issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: meetup-event-${{ github.repository_id }}-${{ needs.prepare-synthetic-issue.outputs.issue-number }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare synthetic consumer workspace
        shell: bash
        run: |
          mkdir -p .github referentials

          cat > referentials/hosting.csv <<'EOF'
          host_id,name,contact_id,contact,mail,phone,venue_address,venue_postal_code,venue_city
          host-0001,Public Venue,contact-0001,Private Host Contact,host@example.invalid,,1 Example Street,13001,Marseille
          EOF

          cat > referentials/speakers.csv <<'EOF'
          speaker_id,firstname,lastname,company,mail,phone
          speaker-0001,Ada,Speaker,Public Company,speaker@example.invalid,
          EOF

      # The synthetic issue has completed email tasks, so no delivery is due.
      - name: Reconcile synthetic meetup communications
        id: reconcile-communications
        uses: $/actions/communication/reconcile-email
        with:
          meetup-event-url-prefix: https://www.meetup.com/example-group/events/
          community-event-url-prefixes: '["https://community.example.test/events/"]'
          asset-folder-url-prefix: https://drive.google.com/drive/folders/
          locale: en
          conference-hall-event: synthetic-cfp
          conference-hall-api-key: synthetic-key
          slides-ready: "true"
          slides-url: https://docs.google.com/presentation/d/synthetic-slides/edit
          openfeedback-api-key: oforg_synthetic-key
          issue-number: ${{ needs.prepare-synthetic-issue.outputs.issue-number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          managed-comment-author: integration-tests[bot]
          mailings-token: synthetic-mailings-token
          slack-token: synthetic-slack-token
          slack-organizer-channel-id: synthetic-slack-channel

      - name: Assert communication reconciliation
        shell: bash
        env:
          DIAGNOSTICS: ${{ steps.reconcile-communications.outputs.diagnostics }}
        run: |
          jq -e 'type == "array" and all(.[]; .severity != "error")' <<< "$DIAGNOSTICS" >/dev/null

  test-assets-reconcile-documents:
    name: Test required document and PDF configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required asset credentials
        id: assets
        continue-on-error: true
        uses: $/actions/assets/reconcile-documents
        with:
          managed-comment-author: synthetic-bot[bot]
          meetup-event-url-prefix: https://www.meetup.com/example-group/events/
          community-event-url-prefixes: '["https://community.example.test/events/"]'
          asset-folder-url-prefix: https://drive.google.com/drive/folders/
          locale: en
          conference-hall-event: synthetic-cfp
          conference-hall-api-key: synthetic-key
          issue-number: "1"
          github-token: ${{ github.token }}
          google-credentials: ""
          google-drive-folder-id: synthetic-parent-folder
          google-drive-template-folder-id: synthetic-template-folder

      - name: Assert asset action rejects missing credentials
        shell: bash
        env:
          OUTCOME: ${{ steps.assets.outcome }}
          DIAGNOSTICS: ${{ steps.assets.outputs.diagnostics }}
        run: |
          [[ "$OUTCOME" == "failure" ]]
          jq -e 'map(.code) | index("action.execution.failed") != null' <<< "$DIAGNOSTICS" >/dev/null
      - name: Reject missing PDF credentials
        id: pdf
        continue-on-error: true
        uses: $/actions/assets/reconcile-slides-pdf
        with:
          locale: en
          issue-number: "1"
          github-token: ${{ github.token }}
          google-credentials: ""
          google-drive-public-folder-id: synthetic-public-folder
          pdf-source: "{}"
          slides-ready: "false"
      - name: Assert PDF configuration failure
        shell: bash
        env:
          OUTCOME: ${{ steps.pdf.outcome }}
          DIAGNOSTICS: ${{ steps.pdf.outputs.diagnostics }}
        run: |
          [[ "$OUTCOME" == "failure" ]]
          jq -e 'map(.code) | index("action.execution.failed") != null' <<< "$DIAGNOSTICS" >/dev/null

  test-feedback-reconcile-event:
    name: Test required feedback configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject a missing OpenFeedback API key
        id: missing-openfeedback-key
        continue-on-error: true
        uses: $/actions/feedback/reconcile-event
        with:
          meetup-event-url-prefix: https://www.meetup.com/example-group/events/
          community-event-url-prefixes: '["https://community.example.test/events/"]'
          asset-folder-url-prefix: https://drive.google.com/drive/folders/
          locale: en
          conference-hall-event: synthetic-cfp
          conference-hall-api-key: synthetic-key
          issue-number: "1"
          github-token: ${{ github.token }}
          openfeedback-api-key: ""

      - name: Reject a missing Kutt API key
        id: missing-key
        continue-on-error: true
        uses: $/actions/feedback/reconcile-short-link
        with:
          locale: en
          github-token: ${{ github.token }}
          kutt-api-key: ""
          kutt-base-url: https://short.example.test
          kutt-link-id: synthetic-link

      - name: Reject a missing Kutt link ID
        id: missing-id
        continue-on-error: true
        uses: $/actions/feedback/reconcile-short-link
        with:
          locale: en
          github-token: ${{ github.token }}
          kutt-api-key: synthetic-key
          kutt-base-url: https://short.example.test
          kutt-link-id: ""

      - name: Reject a missing Kutt base URL
        id: missing-base-url
        continue-on-error: true
        uses: $/actions/feedback/reconcile-short-link
        with:
          locale: en
          github-token: ${{ github.token }}
          kutt-api-key: synthetic-key
          kutt-base-url: ""
          kutt-link-id: synthetic-link

      - name: Assert missing settings fail
        shell: bash
        env:
          OPENFEEDBACK_OUTCOME: ${{ steps.missing-openfeedback-key.outcome }}
          OPENFEEDBACK_DIAGNOSTICS: ${{ steps.missing-openfeedback-key.outputs.diagnostics }}
          KEY_OUTCOME: ${{ steps.missing-key.outcome }}
          ID_OUTCOME: ${{ steps.missing-id.outcome }}
          BASE_URL_OUTCOME: ${{ steps.missing-base-url.outcome }}
        run: |
          [[ "$OPENFEEDBACK_OUTCOME" == "failure" ]]
          jq -e 'map(.code) | index("action.execution.failed") != null' <<< "$OPENFEEDBACK_DIAGNOSTICS" >/dev/null
          [[ "$KEY_OUTCOME" == "failure" ]]
          [[ "$ID_OUTCOME" == "failure" ]]
          [[ "$BASE_URL_OUTCOME" == "failure" ]]

  cleanup-synthetic-issue:
    name: Cleanup synthetic meetup issue
    if: always()
    needs:
      - prepare-synthetic-issue
      - test-event-list-active
      - test-event-reconcile
      - test-communication-reconcile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close synthetic meetup issue
        if: needs.prepare-synthetic-issue.outputs.issue-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ needs.prepare-synthetic-issue.outputs.issue-number }}
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              state: 'closed',
            });
  test-organizer-reconcile-checklist:
    name: Test organizer checklist requires a trusted author
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject a missing trusted author
        id: checklist
        continue-on-error: true
        uses: $/actions/organizer/reconcile-checklist
        with:
          locale: en
          github-token: ${{ github.token }}
          issue-number: "1"
          managed-comment-author: ""
          stage-results: "{}"
      - name: Assert checklist configuration failure
        env:
          OUTCOME: ${{ steps.checklist.outcome }}
        run: test "$OUTCOME" = failure
