# Goal: Point the shared feedback link at the eligible active event.
# Behavior: Recheck active events and reconcile the Kutt redirect under a
# repository/link lock, returning outcomes and diagnostics for organizer reporting.

name: Internal / Feedback / Reconcile short link
on:
  workflow_call:
    inputs:
      locale:
        description:
          Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported
          locales fall back to English.
        required: true
        type: string
      github-app-client-id:
        description: GitHub App client ID used to mint the narrowly scoped installation token for meetup automation.
        required: true
        type: string
      kutt-base-url:
        description: HTTPS base URL of the Kutt instance, without /api/v2. No default.
        required: true
        type: string
      kutt-link-id:
        description: Existing Kutt feedback link API ID.
        required: true
        type: string
    secrets:
      github-app-private-key:
        description:
          PEM-encoded private key for the GitHub App identified by the github-app-client-id input. Used to mint a
          narrowly scoped installation token.
        required: true
      kutt-api-key:
        description: API key for the owner of the existing Kutt feedback link.
        required: true
    outputs:
      diagnostics:
        description: Shared-link diagnostics for organizer reporting.
        value: ${{ jobs.reconcile.outputs.diagnostics }}
      outcome:
        description: Shared-link execution outcome for incomplete-run handling.
        value: ${{ jobs.reconcile.outputs.outcome }}
permissions: {}
jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ format('meetup-feedback-{0}-{1}', github.repository_id, inputs.kutt-link-id) }}
      cancel-in-progress: false
      queue: max
    outputs:
      diagnostics: ${{ steps.link.outputs.diagnostics }}
      outcome: ${{ steps.link.outcome }}
    steps:
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] explicitly scoped reusable workflow credentials
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: read
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: local-workflow-actions
        uses: hoverkraft-tech/ci-github-common/actions/local-workflow-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22
        with:
          actions-path: actions
      - name: Reconcile shared feedback link
        id: link
        uses: ./../self-workflow/actions/feedback/reconcile-short-link
        with:
          locale: ${{ inputs.locale }}
          github-token: ${{ steps.app-token.outputs.token }}
          kutt-base-url: ${{ inputs.kutt-base-url }}
          kutt-link-id: ${{ inputs.kutt-link-id }}
          kutt-api-key: ${{ secrets.kutt-api-key }} # zizmor: ignore[secrets-outside-env] explicitly scoped reusable workflow credentials
