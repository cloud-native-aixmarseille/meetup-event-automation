# Goal: Keep organizer tasks aligned with actual workflow results.
# Behavior: Merge stage evidence into the issue checklist, preserve unresolved
# tasks when evidence is incomplete, then reconcile organizer attention in Slack.

name: Internal / Organizer / Reconcile reporting
on:
  workflow_call:
    inputs:
      meetup-event-url-prefix:
        description: HTTPS event URL prefix for the authorized Meetup group, ending in /events/.
        required: true
        type: string
      community-event-url-prefixes:
        description: JSON array of nonempty HTTPS prefixes accepted for community event URLs.
        required: true
        type: string
      asset-folder-url-prefix:
        description: HTTPS prefix accepted for event asset folder URLs.
        required: true
        type: string
      locale:
        description:
          Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported
          locales fall back to English.
        required: true
        type: string
      github-app-client-id:
        description: GitHub App client ID used to mint the narrowly scoped installation token for meetup automation.
        required: true
        type: string
      slack-organizer-channel-id:
        description:
          Internal meetup organizer Slack channel for approval requests and actionable organizer reminders. Public
          announcement channels are separate.
        required: true
        type: string
      issue-number:
        description: Meetup issue number.
        type: number
        required: true
      stage-results:
        description: Actual outcomes and redacted diagnostics from the evaluated operations; absent stages preserve existing tasks.
        required: true
        type: string
    secrets:
      github-app-private-key:
        description:
          PEM-encoded private key for the GitHub App identified by the github-app-client-id input. Used to mint a
          narrowly scoped installation token.
        required: true
      slack-token:
        description: Slack bot token with chat:write and reactions:write for organizer notifications and decision reactions.
        required: true
permissions: {}
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] explicitly scoped reusable workflow credentials
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: local-workflow-actions
        uses: hoverkraft-tech/ci-github-common/actions/local-workflow-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22
        with:
          actions-path: actions
      - name: Reconcile organizer checklist
        id: checklist
        uses: ./../self-workflow/actions/organizer/reconcile-checklist
        with:
          locale: ${{ inputs.locale }}
          issue-number: ${{ inputs.issue-number }}
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          stage-results: ${{ inputs.stage-results }}
      - name: Reconcile organizer attention
        id: attention
        if: ${{ !cancelled() && steps.checklist.outcome == 'success' }}
        uses: ./../self-workflow/actions/organizer/reconcile-attention
        with:
          meetup-event-url-prefix: ${{ inputs.meetup-event-url-prefix }}
          community-event-url-prefixes: ${{ inputs.community-event-url-prefixes }}
          asset-folder-url-prefix: ${{ inputs.asset-folder-url-prefix }}
          locale: ${{ inputs.locale }}
          issue-number: ${{ inputs.issue-number }}
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          slack-organizer-channel-id: ${{ inputs.slack-organizer-channel-id }}
          slack-token: ${{ secrets.slack-token }} # zizmor: ignore[secrets-outside-env] explicitly scoped reusable workflow credentials
          stage-results: ${{ inputs.stage-results }}
