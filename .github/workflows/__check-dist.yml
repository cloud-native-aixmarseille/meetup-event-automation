# Goal: Keep committed action bundles consistent with their source.
# Behavior: Rebuild all action bundles and fail if any bundle is missing or its
# bytes differ from the committed version.

name: Internal - Checks for dist

on:
  workflow_call:

permissions: {}

jobs:
  check-dist:
    name: Check dist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hoverkraft-tech/ci-github-nodejs/actions/setup-node@fbd3522b68c55a6314aadbededaa487825ba9b35 # 3.0.0
        with:
          ignore-scripts: "false"

      - name: Build and verify committed action bundles
        run: pnpm check:dist
