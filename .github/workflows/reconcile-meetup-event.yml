name: Create or update Meetup event

on:
  workflow_call:
    inputs:
      meetup-event-url-prefix:
        description: HTTPS event URL prefix for the authorized Meetup group, ending in /events/.
        required: true
        type: string
      community-event-url-prefixes:
        description: JSON array of nonempty HTTPS prefixes accepted for community event URLs.
        required: true
        type: string
      asset-folder-url-prefix:
        description: HTTPS prefix accepted for event asset folder URLs.
        required: true
        type: string
      slack-organizer-channel-id:
        description: Organizer Slack channel receiving publication approval requests.
        required: true
        type: string
      issue-number:
        description: Meetup source issue number.
        required: true
        type: number
      github-app-client-id:
        description: GitHub App client ID for the consumer repository.
        required: true
        type: string
      conference-hall-event:
        description: Conference Hall CFP slug for the current event agenda.
        required: true
        type: string
      locale:
        description: Language for the publication report (en or fr).
        required: true
        type: string
      ai-provider:
        description: AI provider identifier (gemini).
        required: true
        type: string
      ai-model:
        description: Model identifier for the selected AI provider.
        required: true
        type: string
    secrets:
      slack-token:
        description: Slack bot token for approval requests and decision reactions.
        required: true
      github-app-private-key:
        description: GitHub App private key for the narrowly scoped consumer token.
        required: true
      conference-hall-api-key:
        description: Read-only Conference Hall event API key.
        required: true
      meetup-email:
        description: Email of the authorized Meetup organizer account.
        required: true
      meetup-password:
        description: Password of the authorized Meetup organizer account.
        required: true
      ai-api-key:
        description: API key for the selected AI provider.
        required: true

permissions: {}

jobs:
  publish:
    if: >-
      ${{ github.event_name != 'issue_comment' ||
          (!github.event.issue.pull_request && github.event.issue.state == 'open' &&
           github.event.action == 'edited' && github.event.sender.type == 'User' &&
           github.event.comment.user.type == 'Bot' &&
           startsWith(github.event.comment.body, '<!-- meetup-organizer-approval:v1 ') &&
           contains(github.event.comment.body, '"kind":"meetup-publication"')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: meetup-event-${{ github.repository_id }}-${{ inputs.issue-number }}
      cancel-in-progress: false
    env:
      DEBUG: ""
      PWDEBUG: ""
    steps:
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] explicit reusable workflow secret
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write

      - name: Checkout consumer configuration and referentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: local-workflow-actions
        uses: hoverkraft-tech/ci-github-common/actions/local-workflow-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
        with:
          # The external Playwright runtime and its CLI use this checkout's lockfile.
          actions-path: .

      - name: Install locked automation dependencies
        uses: hoverkraft-tech/ci-github-nodejs/actions/setup-node@81a4bca8445b7b273455ff26a9a5c3c31c86b2a1 # 0.25.0
        with:
          working-directory: ../self-workflow

      - name: Install Chromium
        working-directory: ../self-workflow
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install locked challenge solver dependencies
        working-directory: ../self-workflow/packages/adapter/browser-authentication/hcaptcha-captcha-resolver/python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Create or update the issue's Meetup event
        uses: ./../self-workflow/actions/publication/reconcile-meetup
        with:
          meetup-event-url-prefix: ${{ inputs.meetup-event-url-prefix }}
          community-event-url-prefixes: ${{ inputs.community-event-url-prefixes }}
          asset-folder-url-prefix: ${{ inputs.asset-folder-url-prefix }}
          issue-number: ${{ inputs.issue-number }}
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          conference-hall-event: ${{ inputs.conference-hall-event }}
          conference-hall-api-key: ${{ secrets.conference-hall-api-key }} # zizmor: ignore[secrets-outside-env] explicit reusable workflow secret
          locale: ${{ inputs.locale }}
          meetup-email: ${{ secrets.meetup-email }} # zizmor: ignore[secrets-outside-env] required reusable workflow secret is forwarded explicitly
          meetup-password: ${{ secrets.meetup-password }} # zizmor: ignore[secrets-outside-env] required reusable workflow secret is forwarded explicitly
          ai-provider: ${{ inputs.ai-provider }}
          ai-model: ${{ inputs.ai-model }}
          ai-api-key: ${{ secrets.ai-api-key }} # zizmor: ignore[secrets-outside-env] required reusable workflow secret is forwarded explicitly
          slack-organizer-channel-id: ${{ inputs.slack-organizer-channel-id }}
          slack-token: ${{ secrets.slack-token }} # zizmor: ignore[secrets-outside-env] explicit reusable workflow secret
