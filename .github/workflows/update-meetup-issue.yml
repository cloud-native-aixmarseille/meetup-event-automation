# Reusable workflow that checks one meetup issue and applies the due
# communication and issue updates needed to keep it current.
#
# The workflow creates a separate GitHub App installation token for
# `<repository-owner>/mailings` using the supplied App client ID and private key.
# The App must be installed there with Contents: write permission. The token is
# used in the dispatch job and revoked when the job finishes; callers do not
# provide a mailing token secret.
name: Update meetup issue

on:
  workflow_call:
    inputs:
      locale:
        description: Language for generated reports and guidance (en or fr). Regional variants are supported; unsupported locales fall back to English.
        required: false
        type: string
        default: en
      github-app-client-id:
        description: GitHub App client ID used to mint the narrowly scoped installation token for meetup automation.
        required: true
        type: string
      slack-organizer-channel-id:
        description: Internal meetup organizer Slack channel for approval requests and actionable organizer reminders. Public announcement channels are separate.
        required: true
        type: string
      google-drive-meetup-folder-id:
        description: Google Drive folder ID of the parent meetup folder used for asset reconciliation.
        required: true
        type: string
      google-drive-meetup-template-folder-id:
        description: Google Drive folder ID of the template folder used for asset reconciliation.
        required: true
        type: string
      kutt-base-url:
        description: HTTPS base URL of the Kutt instance, without /api/v2. No default.
        required: true
        type: string
      kutt-link-id:
        description: Existing Kutt feedback link API ID.
        required: true
        type: string
      conference-hall-event:
        description: Conference Hall CFP slug for live linked profiles and selected proposals.
        required: true
        type: string
    secrets:
      openfeedback-api-key:
        description: OpenFeedback organization API key (oforg_) used to create and update events.
        required: true
      kutt-api-key:
        description: API key for the owner of the existing Kutt feedback link.
        required: true
      google-credentials:
        description: Google service-account JSON for Drive asset reconciliation.
        required: true
      github-app-private-key:
        description: PEM-encoded private key for the GitHub App identified by the github-app-client-id input. Used to mint a narrowly scoped installation token.
        required: true
      slack-token:
        description: Slack bot token with chat:write and reactions:write for organizer notifications and decision reactions.
        required: true
      conference-hall-api-key:
        description: Read-only Conference Hall event API key.
        required: true

permissions: {}

jobs:
  manage:
    if: >-
      ${{ !github.event.issue.pull_request &&
          (github.event_name != 'issue_comment' ||
           (github.event.action == 'edited' &&
            github.event.sender.type == 'User' &&
            github.event.comment.user.type == 'Bot' &&
            startsWith(github.event.comment.body, '<!-- meetup-organizer-approval:v1 '))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: meetup-event-${{ github.repository_id }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] reusable workflows cannot safely consume environment secrets without broad inherit; this workflow forwards only the required secret
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write

      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: local-workflow-actions
        uses: hoverkraft-tech/ci-github-common/actions/local-workflow-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
        with:
          actions-path: actions

      - name: Reconcile event feedback
        id: feedback
        uses: ./../self-workflow/actions/publication/reconcile-feedback
        with:
          conference-hall-event: ${{ inputs.conference-hall-event }}
          conference-hall-api-key: ${{ secrets.conference-hall-api-key }} # zizmor: ignore[secrets-outside-env] explicit reusable workflow secret
          locale: ${{ inputs.locale }}
          issue-number: ${{ github.event.issue.number }}
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          kutt-base-url: ${{ inputs.kutt-base-url }}
          kutt-link-id: ${{ inputs.kutt-link-id }}
          openfeedback-api-key: ${{ secrets.openfeedback-api-key }} # zizmor: ignore[secrets-outside-env] required reusable-workflow secret is forwarded explicitly
          kutt-api-key: ${{ secrets.kutt-api-key }} # zizmor: ignore[secrets-outside-env] required reusable-workflow secret is forwarded explicitly

      - name: Reconcile event assets
        id: assets
        uses: ./../self-workflow/actions/publication/reconcile-assets
        with:
          conference-hall-event: ${{ inputs.conference-hall-event }}
          conference-hall-api-key: ${{ secrets.conference-hall-api-key }} # zizmor: ignore[secrets-outside-env] explicit reusable workflow secret
          locale: ${{ inputs.locale }}
          issue-number: ${{ github.event.issue.number }}
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          google-credentials: ${{ secrets.google-credentials }} # zizmor: ignore[secrets-outside-env] required reusable-workflow secret is forwarded explicitly
          google-drive-meetup-folder-id: ${{ inputs.google-drive-meetup-folder-id }}
          google-drive-meetup-template-folder-id: ${{ inputs.google-drive-meetup-template-folder-id }}

      - name: Create mailings GitHub App token
        id: mailings-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-private-key }} # zizmor: ignore[secrets-outside-env] reusable workflow receives the App key explicitly to mint a repository-scoped token
          owner: ${{ github.repository_owner }}
          repositories: mailings
          permission-contents: write

      - name: Reconcile communications
        id: communications
        uses: ./../self-workflow/actions/communication/reconcile
        with:
          conference-hall-event: ${{ inputs.conference-hall-event }}
          conference-hall-api-key: ${{ secrets.conference-hall-api-key }} # zizmor: ignore[secrets-outside-env] explicit reusable workflow secret
          slides-ready: ${{ steps.assets.outputs.slides-ready }}
          slides-url: ${{ fromJSON(steps.assets.outputs.drive-files)['slides-link'] }}
          openfeedback-api-key: ${{ secrets.openfeedback-api-key }} # zizmor: ignore[secrets-outside-env] required reusable-workflow secret is forwarded explicitly
          report-errors-to-issue: "false"
          locale: ${{ inputs.locale }}
          issue-number: ${{ github.event.issue.number }}
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          mailings-token: ${{ steps.mailings-token.outputs.token }}
          slack-organizer-channel-id: ${{ inputs.slack-organizer-channel-id }}
          slack-token: ${{ secrets.slack-token }} # zizmor: ignore[secrets-outside-env] required reusable-workflow secret is forwarded explicitly to avoid secrets: inherit

      - name: Reconcile event
        id: reconcile
        if: always()
        uses: ./../self-workflow/actions/event/reconcile
        with:
          conference-hall-event: ${{ inputs.conference-hall-event }}
          conference-hall-api-key: ${{ secrets.conference-hall-api-key }} # zizmor: ignore[secrets-outside-env] explicit reusable workflow secret
          locale: ${{ inputs.locale }}
          issue-number: ${{ github.event.issue.number }}
          mode: fix
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}

      - name: Reconcile organizer attention
        id: attention
        if: ${{ always() && steps.app-token.outcome == 'success' && steps.local-workflow-actions.outcome == 'success' }}
        uses: ./../self-workflow/actions/communication/reconcile-attention
        with:
          locale: ${{ inputs.locale }}
          issue-number: ${{ github.event.issue.number }}
          github-token: ${{ steps.app-token.outputs.token }}
          managed-comment-author: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          slack-organizer-channel-id: ${{ inputs.slack-organizer-channel-id }}
          slack-token: ${{ secrets.slack-token }} # zizmor: ignore[secrets-outside-env] required reusable-workflow secret is forwarded explicitly
          recover-post: "null"
          stage-results: >-
            {"event":{"outcome":${{ toJSON(steps.reconcile.outcome) }},"diagnostics":${{ toJSON(steps.reconcile.outputs.diagnostics) }}},
            "assets":{"outcome":${{ toJSON(steps.assets.outcome) }},"diagnostics":${{ toJSON(steps.assets.outputs.diagnostics) }}},
            "feedback":{"outcome":${{ toJSON(steps.feedback.outcome) }},"diagnostics":${{ toJSON(steps.feedback.outputs.diagnostics) }}},
            "communications":{"outcome":${{ toJSON(steps.communications.outcome) }},"diagnostics":${{ toJSON(steps.communications.outputs.diagnostics) }}}}
